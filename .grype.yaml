ignore:
  # Fix only available in Python 3.15.0b2 (pre-release).
  # Running a beta CPython in production is not acceptable.
  # Risk accepted: monitor python.org/dev/peps for stable 3.15 GA release
  # and upgrade base image at that point.
  - vulnerability: CVE-2026-7210
    reason: fix-requires-prerelease

  # Fixes are only reported in Python 3.15 pre-release/unreleased versions.
  # Keep production on the latest stable Python 3.13 patch release and remove
  # these exceptions once fixes are backported to a stable supported release.
  - vulnerability: CVE-2026-11940
    reason: fix-requires-prerelease
  - vulnerability: CVE-2026-11972
    reason: fix-requires-prerelease
  - vulnerability: CVE-2026-15308
    reason: fix-not-yet-in-stable-release
